name: Production UI Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/production-ui-smoke.mjs'
      - '.github/workflows/production-ui-smoke.yml'
  workflow_run:
    workflows: ['Deploy Pages']
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Chrome
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Run production browser smoke
        run: node scripts/production-ui-smoke.mjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ui-smoke
          path: production-smoke.png
          if-no-files-found: ignore
