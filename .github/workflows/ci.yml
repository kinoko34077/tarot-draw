name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate self-hosted Deck A reconstructed art
        run: node scripts/generate-deck-a-reconstruction.mjs
      - name: Verify Deck A print images (alpha, framing, offline source)
        run: node scripts/check-deck-a-assets.mjs
      - run: npm test
      - run: npm run check
      - run: npm run check:cloudflare
      - name: Resolve Chrome for branch-only UI smoke
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Install Japanese font for legible browser UX evidence
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          fc-match -f '%{family}\n' ':lang=ja' | grep -i 'Noto'
      - name: Characterize P0 delayed shuffle and draw races (mocked local API, not production)
        run: node scripts/ux-p0-race-smoke.mjs --expect-safe
      - name: Verify five-card dialog in local Chromium (desktop/mobile)
        run: node scripts/card-keyword-branch-smoke.mjs
      - name: Capture full-size Deck A optical proofs for independent print review
        shell: bash
        run: |
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1024,1850 --screenshot=deck-a-title-proof.png "file://$PWD/web/assets/cards/detail/deck-a-title.svg"
          "$CHROME_BIN" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --hide-scrollbars --window-size=1024,1850 --screenshot=deck-a-introduction-proof.png "file://$PWD/web/assets/cards/detail/deck-a-introduction.svg"
          test -s deck-a-title-proof.png
          test -s deck-a-introduction-proof.png
      - name: Upload user-visible Deck A print proof images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deck-a-issue83-print-proofs
          path: |
            deck-a-title-proof.png
            deck-a-introduction-proof.png
          if-no-files-found: warn
      - name: Collect machine-observed child-like/novice/expert UX evidence (baseline, existing failures classified)
        env:
          UX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ux-persona-evidence.mjs --baseline
      - name: Upload persona-proxy quantitative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-persona-evidence
          path: ux-persona-evidence.json
          if-no-files-found: warn
      - name: Retain branch-only UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyword-grid-branch-preview
          path: |
            keyword-grid-desktop.png
            keyword-grid-mobile.png
          if-no-files-found: ignore
