name: Generate Card WebP Assets

on:
  push:
    branches: [fix/card-webp-assets]
    paths:
      - 'scripts/generate-card-assets.mjs'
      - '.github/workflows/generate-card-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install transient encoder
        run: npm install --no-save --package-lock=false sharp
      - name: Generate WebP assets
        run: node scripts/generate-card-assets.mjs
      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/cards
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "assets: generate compressed RWS WebP [generated-card-assets]"
          git push origin HEAD:fix/card-webp-assets
