<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tarot Draw</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Tarot Draw</h1>
    <button id="settingsButton" class="settings-open secondary" type="button" aria-label="設定を開く" title="デッキとカードの設定" aria-haspopup="dialog" aria-controls="settingsDialog"><span aria-hidden="true">⚙</span><span>設定</span></button>
  </header>

  <main class="workspace">
    <div id="readings" class="readings" aria-label="リーディング履歴"></div>

    <div class="history-actions">
      <button id="shuffleButton" class="shuffle-button primary" type="button">シャッフル</button>
      <button id="drawButton" class="draw-button primary hidden" type="button">引く</button>
      <button id="newReadingButton" class="secondary new-reading-button hidden" type="button">＋ 新規</button>
    </div>

    <p class="art-credit">
      カード画像: Rider–Waite–Smith / Pamela Colman Smith (1910) · Public Domain ·
      <a href="https://commons.wikimedia.org/wiki/Category:Rider-Waite-Smith_tarot_deck_(Geldard)" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>
    </p>
  </main>

  <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
    <div class="settings-panel">
      <header class="settings-heading">
        <h2 id="settingsTitle">デッキ設定</h2>
        <button id="settingsClose" class="secondary settings-close" type="button" aria-label="設定を閉じる">×</button>
      </header>
      <p class="settings-help">使用するデッキと、独自カードを含めるかを選択します。</p>
      <fieldset class="deck-choices">
        <legend>デッキ</legend>
        <label class="deck-choice">
          <span class="deck-choice-line"><input type="radio" name="deckId" value="A"><strong>デッキ A</strong><span>タイトル ＋ 紹介カード</span></span>
          <span class="deck-preview-list" aria-label="デッキAの独自カード">
            <span class="deck-preview"><span class="deck-preview-face">画像準備中</span><span>タイトルカード</span></span>
            <span class="deck-preview"><span class="deck-preview-face">画像準備中</span><span>パメラ・コールマン・スミス紹介カード</span></span>
          </span>
        </label>
        <label class="deck-choice">
          <span class="deck-choice-line"><input type="radio" name="deckId" value="B" checked><strong>デッキ B</strong><span>タイトル ＋ 保証カード</span></span>
          <span class="deck-preview-list" aria-label="デッキBの独自カード">
            <span class="deck-preview"><span class="deck-preview-face">画像準備中</span><span>タイトルカード</span></span>
            <span class="deck-preview"><span class="deck-preview-face">画像準備中</span><span>保証カード</span></span>
          </span>
        </label>
      </fieldset>
      <label class="settings-custom-choice">
        <input id="includeCustomCards" type="checkbox" checked>
        <span><strong>オリジナルカードを使用</strong><small>オン：80枚（独自カード2枚入り）／オフ：78枚</small></span>
      </label>
      <p id="settingsScope" class="settings-scope" role="status" aria-live="polite">この設定は次のシャッフルに反映されます。</p>
      <div class="settings-footer"><button id="settingsDone" class="primary" type="button">完了</button></div>
    </div>
  </dialog>

  <div id="axisMenu" class="axis-menu hidden" role="menu" aria-label="行列操作">
    <button id="moveAxisBeforeButton" class="axis-menu-item" type="button" role="menuitem">前へ移動</button>
    <button id="moveAxisAfterButton" class="axis-menu-item" type="button" role="menuitem">後ろへ移動</button>
    <button id="deleteAxisButton" class="danger-menu-item" type="button" role="menuitem">削除</button>
  </div>

  <dialog id="cardDetailDialog" class="card-detail-dialog" aria-labelledby="cardDetailTitle">
    <div class="card-detail-panel">
      <header class="card-detail-header">
        <div class="card-detail-heading-line">
          <h2 id="cardDetailTitle"></h2>
          <p id="cardDetailOrientation" class="detail-orientation"></p>
        </div>
        <div class="detail-header-actions">
          <button id="cardDetailClose" class="detail-close" type="button" aria-label="カード詳細を閉じる">×</button>
        </div>
      </header>
      <div class="card-detail-body">
        <div id="cardDetailVisual" class="detail-visual-slot"></div>
        <section id="cardDetailKeywordGrid" class="card-detail-keywords hidden" aria-labelledby="cardDetailKeywordHeading">
          <table id="cardDetailKeywordRows" class="keyword-grid-table" aria-labelledby="cardDetailKeywordHeading">
            <thead>
              <tr>
                <th colspan="5" class="keyword-grid-title-cell">
                  <div class="keyword-grid-heading-bar">
                    <h3 id="cardDetailKeywordHeading">キーワード</h3>
                    <details id="cardDetailSourceInfo" class="keyword-source-disclosure hidden">
                      <summary class="keyword-source-trigger" aria-label="キーワードの意味と出典を表示" title="キーワードの意味と出典"><span aria-hidden="true">i</span></summary>
                      <div class="keyword-source-popover">
                        <strong>キーワードについて</strong>
                        <p>正・逆位置の両面を含む、カード全体の関連語です。</p>
                        <p>出典：Tarotoo Tarot Dataset（MIT）。語句は独自編集。</p>
                        <a href="https://github.com/Tarotoo-com/tarotoo-tarot-dataset" target="_blank" rel="noopener noreferrer">出典・利用条件</a>
                      </div>
                    </details>
                  </div>
                </th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </section>
        <div class="card-detail-copy">
          <div id="cardDetailReference">
            <section class="detail-meaning">
              <h3>本質</h3>
              <p id="cardDetailEssence"></p>
            </section>
            <div class="detail-orientations" role="group" aria-label="正位置と逆位置の意味を比較">
              <section id="cardDetailUprightBlock" class="detail-meaning" data-active="false" aria-label="正位置">
                <h3>正位置 <span class="detail-picked-label hidden">今回</span></h3>
                <p id="cardDetailUpright"></p>
              </section>
              <section id="cardDetailReversedBlock" class="detail-meaning" data-active="false" aria-label="逆位置">
                <h3>逆位置 <span class="detail-picked-label hidden">今回</span></h3>
                <p id="cardDetailReversed"></p>
              </section>
            </div>
          </div>
          <section id="cardDetailCustom" class="detail-meaning hidden">
            <h3>独自カード</h3>
            <p id="cardDetailCustomText"></p>
          </section>
        </div>
      </div>
    </div>
  </dialog>

  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
